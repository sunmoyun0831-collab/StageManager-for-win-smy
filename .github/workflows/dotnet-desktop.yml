name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Test
      run: dotnet test StageManager.Tests/StageManager.Tests.csproj --configuration Release

    # Self-contained single file, so the exe runs without an installed .NET runtime
    - name: Publish
      run: dotnet publish StageManager/StageManager.csproj --configuration Release --runtime win-x64 --self-contained --output ./Artifacts -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: StageManager-${{ github.run_number }}
        path: ./Artifacts/StageManager.exe
